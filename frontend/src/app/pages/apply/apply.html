<div class="form-container">

  <h2>
    <i class="fas fa-briefcase"></i>
    Job Application Form
  </h2>

  <form #form="ngForm" (ngSubmit)="submitForm(form)" *ngIf="!submitted">


    <div class="name-row">

      <div class="input-group">
        <input type="text" placeholder=" " [(ngModel)]="applicant.firstName" name="firstName" required>

        <label>
          <i class="fas fa-user"></i>
          First Name
        </label>
      </div>

      <div class="input-group">
        <input type="text" placeholder=" " [(ngModel)]="applicant.lastName" name="lastName" required>

        <label>
          <i class="fas fa-user"></i>
          Last Name
        </label>
      </div>

    </div>
    <div class="row-group">

      <!-- Email -->
      <div class="input-group">
        <input type="email" placeholder=" " [(ngModel)]="applicant.email" name="email" required>

        <label>
          <i class="fas fa-envelope"></i>
          Email Address
        </label>
      </div>

      <!-- Phone -->
      <div class="input-group">
        <input type="text" maxlength="10" placeholder=" " [(ngModel)]="applicant.phone" name="phone" required>

        <label>
          <i class="fas fa-phone"></i>
          Phone Number
        </label>
      </div>

    </div>

    <div class="row-group">

      <!-- Qualification -->
      <div class="input-group">
        <input type="text" [(ngModel)]="applicant.qualification" name="qualification" required placeholder=" ">

        <label>
          <i class="fas fa-graduation-cap"></i>
          Qualification
        </label>
      </div>

      <!-- DOB -->
      <div class="input-group">

        <input type="date" [(ngModel)]="applicant.dob" name="dob" required>

        <label>
          <i class="fas fa-calendar-days"></i>
          Date of Birth
        </label>

      </div>
      <!-- Gender -->
      <div class="gender-card">

        <label class="gender-floating-label">
          <i class="fas fa-venus-mars"></i>
          Gender
        </label>

        <div class="gender-options">

          <label class="gender-option">

            <input type="radio" name="gender" value="Male" [(ngModel)]="applicant.gender">

            <i class="fas fa-mars"></i>

            Male

          </label>


          <label class="gender-option">

            <input type="radio" name="gender" value="Female" [(ngModel)]="applicant.gender">

            <i class="fas fa-venus"></i>

            Female

          </label>

        </div>

      </div>

    </div>
    <!-- Languages -->
    <div class="form-group">

      <!-- Label and Select in same row -->
      <div class="inline-group">

        <label class="inline-label">
          <i class="fas fa-language"></i>
          Languages Known
        </label>

        <div class="dropdown-header">

          <button type="button" class="dropdown-btn" (click)="showLanguages=!showLanguages">

            <i class="fas fa-globe"></i>

            {{
            selectedLanguageNames.length
            ? selectedLanguageNames.join(', ')
            : 'Select Languages'
            }}

            <i class="fas fa-chevron-down"></i>

          </button>

        </div>

      </div>

      <!-- Dropdown opens below -->
      <div *ngIf="showLanguages" class="dropdown-content">

        <div *ngFor="let group of languageGroups">

          <h4 class="language-group-title">
            {{ group.label }}
          </h4>

          <div class="language-grid">

            <label class="language-option" *ngFor="let option of group.options">

              <input type="checkbox" [checked]="selectedLanguageNames.includes(option)"
                (change)="toggleLanguage(option,$event)">

              <span>{{ option }}</span>

            </label>

          </div>

          <hr>

        </div>

        <div *ngIf="showLanguages" class="dropdown-content">

          <div *ngFor="let group of languageGroups">

            <h4 class="language-group-title">
              {{ group.label }}
            </h4>

            <div class="language-grid">

              <label class="language-option" *ngFor="let option of group.options">

                <input type="checkbox" [checked]="selectedLanguageNames.includes(option)"
                  (change)="toggleLanguage(option,$event)">

                <span>{{ option }}</span>

              </label>

            </div>

            <hr>

          </div>

        </div>

        <button *ngIf="showLanguages" type="button" class="done-btn" (click)="showLanguages = false">

          <i class="fas fa-check"></i>
          Done

        </button>
      </div>

    </div>
    <!-- Language Cards -->
    <div class="language-card-list" *ngIf="selectedLanguages.length > 0">

      <div class="language-card" *ngFor="let language of selectedLanguages">

        <div class="language-card-header">

          <h4>{{language.name}}</h4>

          <button type="button" class="trash-btn" (click)="removeLanguage(language.name)">

            <i class="fas fa-trash"></i>

          </button>

        </div>

        <div class="skill-options">

          <label>
            <input type="checkbox" [(ngModel)]="language.read" [ngModelOptions]="{standalone:true}"
              (change)="updateLanguageAllState(language)">
            Read
          </label>

          <label>
            <input type="checkbox" [(ngModel)]="language.write" [ngModelOptions]="{standalone:true}"
              (change)="updateLanguageAllState(language)">
            Write
          </label>

          <label>
            <input type="checkbox" [(ngModel)]="language.speak" [ngModelOptions]="{standalone:true}"
              (change)="updateLanguageAllState(language)">
            Speak
          </label>

          <label>
            <input type="checkbox" [(ngModel)]="language.all" [ngModelOptions]="{standalone:true}"
              (change)="toggleAll(language)">
            All
          </label>

        </div>

        <div class="progress-wrapper">

          <progress [value]="getProgress(language)" max="100">
          </progress>

          <span>
            {{getProgress(language)}}%
          </span>

        </div>

      </div>

    </div>

    <!-- Companies -->
    <div class="form-group">

      <div class="inline-group">

        <label class="inline-label">

          <i class="fas fa-building"></i>

          Preferred Companies

        </label>

        <div class="dropdown-header">

          <button type="button" class="company-btn" (click)="showCompanies=!showCompanies">

            <i class="fas fa-briefcase"></i>

            {{
            selectedCompanies.length
            ? selectedCompanies.join(', ')
            : 'Select Company'
            }}

            <i class="fas fa-chevron-down"></i>

          </button>

        </div>

      </div>

      <button *ngIf="showCompanies" type="button" class="company-done-btn" (click)="showCompanies = false">

        <i class="fas fa-check"></i>
        Done

      </button>

    </div>
    <div *ngIf="showCompanies" class="company-content">

      <div class="company-grid">

        <label class="company-option" *ngFor="let company of companyNames">

          <input type="checkbox" [checked]="selectedCompanies.includes(company)"
            (change)="toggleCompany(company,$event)">

          <span>{{company}}</span>

        </label>

      </div>

    </div>
    <div class="upload-section">

      <!-- Resume -->
      <div class="upload-card">

        <i class="fas fa-file upload-icon"></i>
        <label class="upload-area">
          <input type="file" accept=".pdf,.doc,.docx" class="file-input" (change)="onResumeSelected($event)">
          <span class="upload-btn">
            Upload Resume
          </span>

          <small>Click to browse files</small>

        </label>

        <p class="file-name">
          {{ resumeFileName || 'No file selected' }}
        </p>

      </div>


      <!-- Marksheet -->
      <div class="upload-card">

        <i class="fas fa-file-alt upload-icon"></i>

        <label class="upload-area">

          <input type="file" accept=".pdf,.doc,.docx" class="file-input" (change)="onMarksheetSelected($event)">
          <span class="upload-btn">
            Upload Marksheet
          </span>

          <small>Click to browse files</small>

        </label>

        <p class="file-name">
          {{ marksheetFileName || 'No file selected' }}
        </p>

      </div>


      <!-- Photo -->
      <div class="upload-card">

        <div class="drop-zone" (dragover)="onDragOver($event)" (drop)="onDrop($event)">

          <i class="fas fa-image upload-icon"></i>

          <h3>Drag & Drop Photos</h3>

          <p>or click below to browse</p>

          <!-- Hidden Input -->
          <input #photoInput type="file" accept="image/*" hidden (change)="onPhotoSelect($event)">
          <!-- Button -->
          <button type="button" class="upload-btn" (click)="photoInput.click()">

            {{ photoFiles.length === 0
            ? 'Choose Photos'
            : '+ Add More Photos (' + (3-photoFiles.length) + ' left)' }}

          </button>

          <small>
            Upload 1–3 images
          </small>

        </div>

        <!-- Preview -->
       <div class="photo-gallery" *ngIf="photoPreviews.length">

  <div class="photo-thumb"
       *ngFor="let preview of photoPreviews; let i=index">

    <img [src]="preview">

    <button
      type="button"
      class="remove-btn"
      (click)="removePhoto(i)">
      ✖
    </button>

  </div>

  <button
    type="button"
    class="mini-add-btn"
    *ngIf="photoFiles.length < 3"
    (click)="photoInput.click()">

    +
  </button>

</div>

      </div>

    </div>
    <!-- Submit -->
    <button type="submit" class="btn-primary" [disabled]="loading">

      <i class="fas fa-paper-plane"></i>
      Submit

    </button>
    <div class="logout-container">
      <button class="btn-logout" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
      </button>
    </div>
  </form>

  <!-- Success -->
  <div *ngIf="submitted" class="success-box">

    <h3>

      <i class="fas fa-circle-check"></i>

      Application Submitted Successfully!

    </h3>

    <button (click)="downloadForm()" class="btn-secondary">

      Download Details

    </button>

  </div>

</div>
